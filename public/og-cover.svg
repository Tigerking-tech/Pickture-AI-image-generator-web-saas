<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7fb"/>
      <stop offset="1" stop-color="#e8e9f4"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5344"/>
      <stop offset="1" stop-color="#1c342a"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5140"/>
      <stop offset="1" stop-color="#463a2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="260" fill="#4f46e5" opacity="0.07"/>
  <circle cx="140" cy="580" r="220" fill="#7c3aed" opacity="0.06"/>

  <!-- 左侧文案 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="88" width="240" height="52" rx="12" fill="url(#brand)"/>
    <text x="104" y="124" font-size="28" font-weight="800" fill="#fff">SUREPIX</text>
    <text x="80" y="240" font-size="64" font-weight="800" fill="#171723">Product photos that</text>
    <text x="80" y="316" font-size="64" font-weight="800" fill="url(#brand)">stay on-brand.</text>
    <text x="80" y="384" font-size="27" fill="#4b4b5f">Deterministic editing · verified fidelity</text>
    <text x="80" y="428" font-size="23" fill="#8a8a9e">~40ms per edit · 100× faster than regeneration</text>

    <!-- 指标条 -->
    <g>
      <rect x="80" y="470" width="300" height="86" rx="14" fill="#ffffff" stroke="#e6e6ef"/>
      <text x="104" y="510" font-size="15" font-weight="700" fill="#8a8a9e">DETERMINISTIC</text>
      <text x="104" y="542" font-size="26" font-weight="800" fill="#171723">photocraft</text>
    </g>
    <g>
      <rect x="400" y="470" width="300" height="86" rx="14" fill="#ffffff" stroke="#e6e6ef"/>
      <text x="424" y="510" font-size="15" font-weight="700" fill="#8a8a9e">AI FALLBACK</text>
      <text x="424" y="542" font-size="26" font-weight="800" fill="#b45309">regenerate</text>
    </g>
  </g>

  <!-- 右侧 before/after -->
  <g>
    <rect x="740" y="90" width="200" height="240" rx="16" fill="#ffffff" stroke="#e6e6ef"/>
    <text x="758" y="120" font-size="14" font-weight="700" fill="#8a8a9e" font-family="Arial">BEFORE</text>
    <rect x="800" y="150" width="18" height="10" rx="3" fill="#9e8a60"/>
    <rect x="795" y="140" width="28" height="12" rx="4" fill="#9e8a60"/>
    <rect x="786" y="160" width="46" height="100" rx="10" fill="url(#bottle)"/>
    <rect x="794" y="186" width="30" height="42" rx="5" fill="#f0eee6"/>
    <circle cx="809" cy="176" r="7" fill="none" stroke="#c42d30" stroke-width="2"/>
    <rect x="756" y="150" width="60" height="20" rx="5" fill="#c42d30"/>
    <text x="766" y="165" font-size="11" font-weight="800" fill="#fff" font-family="Arial">SUREPIX</text>
    <rect x="856" y="270" width="52" height="28" rx="6" fill="#18181c" stroke="#c42d30" stroke-width="1.5"/>
    <text x="882" y="289" font-size="12" font-weight="800" fill="#c42d30" text-anchor="middle" font-family="Arial">$34.90</text>

    <circle cx="960" cy="210" r="22" fill="#4f46e5"/>
    <path d="M950 210 L970 210 M963 202 L970 210 L963 218" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1000" y="90" width="200" height="240" rx="16" fill="#ffffff" stroke="#e6e6ef"/>
    <text x="1018" y="120" font-size="14" font-weight="700" fill="#15803d" font-family="Arial">AFTER · VERIFIED</text>
    <rect x="1060" y="150" width="18" height="10" rx="3" fill="#b09668"/>
    <rect x="1055" y="140" width="28" height="12" rx="4" fill="#b09668"/>
    <rect x="1046" y="160" width="46" height="100" rx="10" fill="url(#bottle2)"/>
    <rect x="1054" y="186" width="30" height="42" rx="5" fill="#f0eee6"/>
    <circle cx="1069" cy="176" r="7" fill="none" stroke="#c42d30" stroke-width="2"/>
    <rect x="1016" y="150" width="60" height="20" rx="5" fill="#c42d30"/>
    <text x="1026" y="165" font-size="11" font-weight="800" fill="#fff" font-family="Arial">SUREPIX</text>
    <rect x="1116" y="270" width="52" height="28" rx="6" fill="#18181c" stroke="#c42d30" stroke-width="1.5"/>
    <text x="1142" y="289" font-size="12" font-weight="800" fill="#c42d30" text-anchor="middle" font-family="Arial">$34.90</text>

    <!-- 保真框 -->
    <rect x="1016" y="150" width="60" height="20" rx="5" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="1054" y="186" width="30" height="42" rx="5" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="1116" y="270" width="52" height="28" rx="6" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  </g>

  <!-- 底部校验条 -->
  <rect x="80" y="560" width="1040" height="46" rx="12" fill="#ffffff" stroke="#e6e6ef"/>
  <circle cx="106" cy="583" r="9" fill="#dcfce7"/>
  <path d="M101 583 l3 3 l6 -6" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="589" font-size="19" font-weight="700" fill="#171723" font-family="Arial">6/6 elements verified — logos, text and price tag untouched</text>
</svg>
